_schema-version: '3.1'
ID: octo-agent
version: 1.0.0
description: "Octo Agent BTP Application"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --only=production --no-audit --no-fund
        - npx -p @sap/cds-dk cds build --production
        - node -e "const fs=require('fs'); const p='gen/srv/package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.scripts.start='node ./srv/server.js'; fs.writeFileSync(p,JSON.stringify(pkg,null,2));"
        - npx copyfiles -u 1 "src/**/*" gen/srv

modules:
  - name: octo-agent-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 2048M
      disk-quota: 2048M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    properties:
      URL_TOKEN: "TBD"
      CLIENT_ID: "TBD"
      SCOPE: "TBD"
      CLIENT_SECRET: "TBD"
      GRANT_TYPE: "client_credentials"
      DIA_HISTORY: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat-histories"
      DIA_CHAT_RAG: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat/retrieval-augmented"
      BRAIN_ID: "TBD"
    requires:
      - name: octo-agent-auth
      - name: octo-agent-dest

  - name: octo-agent
    type: nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: custom
      commands:
        # Build UI
        - npm --prefix ../app/octo-client install
        - npm --prefix ../app/octo-client run build
        # Copy UI to approuter resources
        - npx copyfiles -u 4 "../app/octo-client/dist/**/*" resources
        # Install approuter dependencies
        - npm ci --production
      ignore:
        - node_modules/
    requires:
      - name: octo-agent-auth
      - name: octo-agent-dest
      - name: srv-api
        group: destinations
        properties:
          name: octo-backend
          url: ~{srv-url}
          forwardAuthToken: true
    provides:
      - name: approuter-api
        properties:
          app-url: ${default-url}

resources:
  - name: octo-agent-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: octo-agent-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations:
              - Name: octo-agent-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
    requires:
      - name: srv-api
