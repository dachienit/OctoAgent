_schema-version: '3.1'
ID: octo-agent
version: 1.0.0
description: "Octo Agent BTP Application"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --only=production --no-audit --no-fund
        - npx -p @sap/cds-dk cds build --production

modules:
  - name: octo-agent-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 2048M
      disk-quota: 2048M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services
        properties:
          srv-url: ${default-url}
    properties:
      URL_TOKEN: "TBD"
      CLIENT_ID: "TBD"
      SCOPE: "TBD"
      CLIENT_SECRET: "TBD"
      GRANT_TYPE: "client_credentials"
      DIA_HISTORY: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat-histories"
      DIA_CHAT_RAG: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat/retrieval-augmented"
      BRAIN_ID: "TBD"
    requires:
      - name: octo-agent-auth
      - name: octo-agent-dest

  - name: octo-agent-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: octo-agent-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - octoclient-content.zip
          name: octoclient
          target-path: resources/

  - name: octoclient
    type: html5
    path: app/octo-client
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      after-commands:
        - echo '{"sap.app":{"id":"octoconsoleui","applicationVersion":{"version":"1.0.0"}},"sap.cloud":{"public":true,"service":"octo-agent"}}' > dist/manifest.json
      supported-platforms:
        []
      build-result: dist
      destination: octoclient-content.zip

  - name: octo-agent
    type: nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    requires:
      - name: octo-agent-auth
      - name: octo-agent-repo-host
      - name: octo-agent-dest
      - name: srv-api
        group: destinations
        properties:
          name: octo-backend
          url: ~{srv-url}
          forwardAuthToken: true
    provides:
      - name: approuter-api
        properties:
          app-url: ${default-url}

resources:
  - name: octo-agent-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: octo-agent-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: octo-agent-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations:
              - Name: octo-agent-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
    requires:
      - name: srv-api
