<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>Octo Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="custom-prompt.css" />
</head>

<body>
  <div class="app">
    <!-- Left Sidebar -->
    <aside id="leftSidebar" class="sidebar sidebar-left collapsed">
      <div class="sidebar-content">
        <button id="newChatBtn" class="btn-new-chat">
          <span class="icon">+</span>
          <span>New Chat</span>
        </button>

        <div class="recent-chats-section">
          <div class="section-header" id="recentChatsToggle">
            <span>Recent Chats</span>
            <span class="toggle-icon">▼</span>
          </div>
          <div id="recentChatsList" class="recent-chats-list">
            <div class="chat-item active">
              <span class="chat-icon">🧠</span>
              <div class="chat-info">
                <span class="chat-title">ABAP</span>
                <span class="chat-time">12h ago</span>
              </div>
            </div>
            <div class="chat-item">
              <span class="chat-icon">🧠</span>
              <div class="chat-info">
                <span class="chat-title">RAP Expert</span>
                <span class="chat-time">11/14/2025</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button id="leftSidebarToggle" class="sidebar-toggle sidebar-toggle-left" title="Mở sidebar trái">▶</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="chat-header">
        <div class="brain-info">
          <span class="brain-icon">🧠</span>
          <span id="currentBrainName">Octo Agent</span>
        </div>
      </div>

      <div class="chat-container">
        <div id="messages" class="messages"></div>

        <form id="chatForm" class="chat-input" autocomplete="off">
          <textarea id="userInput" rows="2" placeholder="Send a message to brain 'ABAP'..."></textarea>
          <div id="commandMenu" class="command-menu hidden">
            <button type="button" class="command-item" data-command="phân tích">@phân tích</button>
            <button type="button" class="command-item" data-command="sữa mã">@sữa mã</button>
            <button type="button" class="command-item" data-command="review">@review</button>
          </div>
          <button type="submit" class="btn-send">
            <span>↑</span>
          </button>
        </form>
      </div>

      <div id="waitOverlay" class="wait-overlay hidden">
        <div class="wait-box">
          <span class="spinner"></span>
          <span>Please wait ...</span>
        </div>
      </div>
    </main>

    <!-- Right Sidebar (Settings) -->
    <aside id="rightSidebar" class="sidebar sidebar-right collapsed">
      <button id="rightSidebarToggle" class="sidebar-toggle sidebar-toggle-right" title="Mở sidebar phải">◀</button>
      <div class="sidebar-content">
        <div class="section-header" id="settingsToggle">
          <span>Setting</span>
          <span class="toggle-icon">▼</span>
        </div>

        <section id="settingsPanel" class="settings-panel">
          <div class="settings-grid">
            <label class="field">
              <span>Client Secret</span>
              <input id="envClientSecret" type="password" placeholder="Input Client Secret" />
            </label>
            <label class="field">
              <span>Brain ID</span>
              <input id="envBrainId" type="text" placeholder="Input Brain ID" />
            </label>
            <label class="field">
              <span>NTID</span>
              <input id="envNtid" type="text" placeholder="NTID" />
            </label>
            <label class="field">
              <span>Custom Prompt</span>
              <textarea id="envCustomPrompt" maxlength="2000" rows="4"
                placeholder="Input custom prompt (Max 2000 characters)"></textarea>
              <button type="button" id="expandPromptBtn" class="btn-expand-prompt">Input</button>
            </label>
          </div>
          <div class="settings-actions">
            <button id="saveSettings" class="btn-primary">Save</button>
            <button id="resetSettings" class="btn-ghost">Reset</button>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <!-- Modal for expanding Custom Prompt -->
  <div id="promptModal" class="prompt-modal hidden">
    <div class="prompt-modal-content">
      <div class="prompt-modal-header">
        <h3>Custom Prompt</h3>
        <button type="button" id="closePromptModal" class="btn-close-modal">✕</button>
      </div>
      <div class="prompt-modal-body">
        <textarea id="modalCustomPrompt" maxlength="2000"
          placeholder="Input custom prompt (Max 2000 characters)"></textarea>
        <div class="char-counter">
          <span id="charCount">0</span> / 2000 characters
        </div>
      </div>
      <div class="prompt-modal-footer">
        <button type="button" id="applyPromptBtn" class="btn-primary">Apply</button>
        <button type="button" id="cancelPromptBtn" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>

</html>
