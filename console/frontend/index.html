<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SAP BTP Hackathon 2025</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1 class="title">
        <img src="./logo.png" alt="Logo" class="logo" />
        <span>SAP BTP Hackathon 2025 - NHV team</span>
      </h1>

      <div class="searchbar">
        <div class="plus">+</div>
        <input id="input" placeholder="Enter Jira IssueKey ..." />
        <button id="send" title="Send">
          <img src="./send.png" alt="Send" class="icon" />
        </button>
      </div>
    </div>

    <div id="chat-window" class="chat-window hidden">
      <div id="messages" class="messages"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
