_schema-version: '3.1'
ID: octo-agent
version: 1.0.0
description: "Octo Agent BTP Application"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --only=production --no-audit --no-fund
        - npx -p @sap/cds-dk cds build --production

modules:
  - name: octo-agent-srv
    type: nodejs
    path: gen/srv
    parameters:
      command: npx cds-serve
      health-check-type: http
      health-check-http-endpoint: /health
      buildpack: nodejs_buildpack
      memory: 2048M
      disk-quota: 2048M
    build-parameters:
      builder: custom
      commands:
        - npm ci --production --no-audit
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    properties:
      URL_TOKEN: "https://login.microsoftonline.com/0ae51e19-07c8-4e4b-bb6d-648ee58410f4/oauth2/v2.0/token"
      CLIENT_ID: "d02d08ba-44d3-400c-bb42-da0f63c44bab"
      SCOPE: "api://dia-brain/.default"
      CLIENT_SECRET: ""
      GRANT_TYPE: "client_credentials"
      DIA_HISTORY: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat-histories"
      DIA_CHAT_RAG: "https://ews-emea.api.bosch.com/it/application/dia-brain/v1/api/chat/retrieval-augmented"
      BRAIN_ID: "e39Lh3w2teng"
    requires:
      - name: octo-agent-auth
      - name: octo-agent-dest
      - name: octo-agent-db

  - name: octo-agent-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: octo-agent-db

  - name: octo-agent
    type: nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: custom
      commands:
        # Build UI
        - npm --prefix ../app/octo-client install
        - npm --prefix ../app/octo-client run build
        # Copy UI to approuter resources
        - npx copyfiles -u 4 "../app/octo-client/dist/**/*" resources
        # Install approuter dependencies
        - npm ci --production
      ignore:
        - node_modules/
    requires:
      - name: octo-agent-auth
      - name: octo-agent-dest
      - name: srv-api
        group: destinations
        properties:
          name: octo-backend
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 300000
    provides:
      - name: approuter-api
        properties:
          app-url: ${default-url}

resources:
  - name: octo-agent-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: octo-agent-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations:
              - Name: octo-agent-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
  
  - name: octo-agent-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared